services:
  comfyui-gpu0:
    build:
      context: .
    image: comfyui-cuda13:local
    container_name: comfyui-gpu0
    restart: unless-stopped
    ports:
      - "8188:8188"
    gpus:
      - device_ids: ["0"]
        capabilities: ["gpu"]
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64
      # RTX 4090 (Ada, sm_89): fp8_matrix_mult needs FP8 tensor cores, do not copy to the 3090 worker
      COMFYUI_ARGS: --listen 0.0.0.0 --port 8188 --reserve-vram 1.0 --fast fp16_accumulation fp8_matrix_mult --preview-method none --enable-manager --enable-assets --input-directory /workspace/ComfyUI/input --output-directory /workspace/ComfyUI/output --temp-directory /workspace/ComfyUI/temp --user-directory /workspace/ComfyUI/user
    volumes:
      - ./user/gpu0:/workspace/ComfyUI/user
      - E:/AI-Models/comfyui-docker/models/checkpoints:/workspace/ComfyUI/models/checkpoints
      - E:/AI-Models/comfyui-docker/models/loras:/workspace/ComfyUI/models/loras
      - E:/AI-Models/comfyui-docker/models/controlnet:/workspace/ComfyUI/models/controlnet
      - E:/AI-Models/comfyui-docker/models/t2i_adapter:/workspace/ComfyUI/models/t2i_adapter
      - E:/AI-Models/comfyui-docker/models/vae:/workspace/ComfyUI/models/vae
      - E:/AI-Models/comfyui-docker/models/vae_approx:/workspace/ComfyUI/models/vae_approx
      - E:/AI-Models/comfyui-docker/models/clip:/workspace/ComfyUI/models/clip
      - E:/AI-Models/comfyui-docker/models/clip_vision:/workspace/ComfyUI/models/clip_vision
      - E:/AI-Models/comfyui-docker/models/unet:/workspace/ComfyUI/models/unet
      - E:/AI-Models/comfyui-docker/models/diffusion_models:/workspace/ComfyUI/models/diffusion_models
      - E:/AI-Models/comfyui-docker/models/diffusers:/workspace/ComfyUI/models/diffusers
      - E:/AI-Models/comfyui-docker/models/text_encoders:/workspace/ComfyUI/models/text_encoders
      - E:/AI-Models/comfyui-docker/models/embeddings:/workspace/ComfyUI/models/embeddings
      - E:/AI-Models/comfyui-docker/models/style_models:/workspace/ComfyUI/models/style_models
      - E:/AI-Models/comfyui-docker/models/upscale_models:/workspace/ComfyUI/models/upscale_models
      - E:/AI-Models/comfyui-docker/models/configs:/workspace/ComfyUI/models/configs
      - E:/AI-Models/comfyui-docker/models/mmaudio:/workspace/ComfyUI/models/mmaudio
      - ./custom_nodes:/workspace/ComfyUI/custom_nodes
      - ./inputs:/workspace/ComfyUI/input
      - ./outputs/gpu0:/workspace/ComfyUI/output
      - ./temp/gpu0:/workspace/ComfyUI/temp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    tty: true
    stdin_open: true
    working_dir: /workspace/ComfyUI

  comfyui-gpu1:
    build:
      context: .
    image: comfyui-cuda13:local
    container_name: comfyui-gpu1
    restart: unless-stopped
    ports:
      - "8189:8189"
    gpus:
      - device_ids: ["1"]
        capabilities: ["gpu"]
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      CUDA_VISIBLE_DEVICES: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64
      # RTX 3090 (Ampere, sm_86): no FP8 hardware, fp16_accumulation only
      COMFYUI_ARGS: --listen 0.0.0.0 --port 8189 --reserve-vram 1.0 --fast fp16_accumulation --preview-method none --enable-manager --enable-assets --input-directory /workspace/ComfyUI/input --output-directory /workspace/ComfyUI/output --temp-directory /workspace/ComfyUI/temp --user-directory /workspace/ComfyUI/user
    volumes:
      - ./user/gpu1:/workspace/ComfyUI/user
      - E:/AI-Models/comfyui-docker/models/checkpoints:/workspace/ComfyUI/models/checkpoints
      - E:/AI-Models/comfyui-docker/models/loras:/workspace/ComfyUI/models/loras
      - E:/AI-Models/comfyui-docker/models/controlnet:/workspace/ComfyUI/models/controlnet
      - E:/AI-Models/comfyui-docker/models/t2i_adapter:/workspace/ComfyUI/models/t2i_adapter
      - E:/AI-Models/comfyui-docker/models/vae:/workspace/ComfyUI/models/vae
      - E:/AI-Models/comfyui-docker/models/vae_approx:/workspace/ComfyUI/models/vae_approx
      - E:/AI-Models/comfyui-docker/models/clip:/workspace/ComfyUI/models/clip
      - E:/AI-Models/comfyui-docker/models/clip_vision:/workspace/ComfyUI/models/clip_vision
      - E:/AI-Models/comfyui-docker/models/unet:/workspace/ComfyUI/models/unet
      - E:/AI-Models/comfyui-docker/models/diffusion_models:/workspace/ComfyUI/models/diffusion_models
      - E:/AI-Models/comfyui-docker/models/diffusers:/workspace/ComfyUI/models/diffusers
      - E:/AI-Models/comfyui-docker/models/text_encoders:/workspace/ComfyUI/models/text_encoders
      - E:/AI-Models/comfyui-docker/models/embeddings:/workspace/ComfyUI/models/embeddings
      - E:/AI-Models/comfyui-docker/models/style_models:/workspace/ComfyUI/models/style_models
      - E:/AI-Models/comfyui-docker/models/upscale_models:/workspace/ComfyUI/models/upscale_models
      - E:/AI-Models/comfyui-docker/models/configs:/workspace/ComfyUI/models/configs
      - E:/AI-Models/comfyui-docker/models/mmaudio:/workspace/ComfyUI/models/mmaudio
      - ./custom_nodes:/workspace/ComfyUI/custom_nodes
      - ./inputs:/workspace/ComfyUI/input
      - ./outputs/gpu1:/workspace/ComfyUI/output
      - ./temp/gpu1:/workspace/ComfyUI/temp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8189/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    tty: true
    stdin_open: true
    working_dir: /workspace/ComfyUI

  comfyui-sharded:
    profiles: ["sharded"]
    build:
      context: .
    image: comfyui-cuda13:local
    container_name: comfyui-sharded
    restart: unless-stopped
    ports:
      - "8190:8190"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      CUDA_VISIBLE_DEVICES: "0,1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64
      # Spans both GPUs: no fp8_matrix_mult because ops may land on the 3090 (sm_86)
      COMFYUI_ARGS: --listen 0.0.0.0 --port 8190 --cuda-device 0,1 --default-device 0 --reserve-vram 1.0 --fast fp16_accumulation --preview-method none --enable-manager --enable-assets --input-directory /workspace/ComfyUI/input --output-directory /workspace/ComfyUI/output --temp-directory /workspace/ComfyUI/temp --user-directory /workspace/ComfyUI/user
    volumes:
      - ./user/sharded:/workspace/ComfyUI/user
      - E:/AI-Models/comfyui-docker/models/checkpoints:/workspace/ComfyUI/models/checkpoints
      - E:/AI-Models/comfyui-docker/models/loras:/workspace/ComfyUI/models/loras
      - E:/AI-Models/comfyui-docker/models/controlnet:/workspace/ComfyUI/models/controlnet
      - E:/AI-Models/comfyui-docker/models/t2i_adapter:/workspace/ComfyUI/models/t2i_adapter
      - E:/AI-Models/comfyui-docker/models/vae:/workspace/ComfyUI/models/vae
      - E:/AI-Models/comfyui-docker/models/vae_approx:/workspace/ComfyUI/models/vae_approx
      - E:/AI-Models/comfyui-docker/models/clip:/workspace/ComfyUI/models/clip
      - E:/AI-Models/comfyui-docker/models/clip_vision:/workspace/ComfyUI/models/clip_vision
      - E:/AI-Models/comfyui-docker/models/unet:/workspace/ComfyUI/models/unet
      - E:/AI-Models/comfyui-docker/models/diffusion_models:/workspace/ComfyUI/models/diffusion_models
      - E:/AI-Models/comfyui-docker/models/diffusers:/workspace/ComfyUI/models/diffusers
      - E:/AI-Models/comfyui-docker/models/text_encoders:/workspace/ComfyUI/models/text_encoders
      - E:/AI-Models/comfyui-docker/models/embeddings:/workspace/ComfyUI/models/embeddings
      - E:/AI-Models/comfyui-docker/models/style_models:/workspace/ComfyUI/models/style_models
      - E:/AI-Models/comfyui-docker/models/upscale_models:/workspace/ComfyUI/models/upscale_models
      - E:/AI-Models/comfyui-docker/models/configs:/workspace/ComfyUI/models/configs
      - E:/AI-Models/comfyui-docker/models/mmaudio:/workspace/ComfyUI/models/mmaudio
      - ./custom_nodes:/workspace/ComfyUI/custom_nodes
      - ./inputs:/workspace/ComfyUI/input
      - ./outputs/sharded:/workspace/ComfyUI/output
      - ./temp/sharded:/workspace/ComfyUI/temp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8190/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    tty: true
    stdin_open: true
    working_dir: /workspace/ComfyUI
